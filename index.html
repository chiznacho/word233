        ];

        // State variables
        let difficultSentenceIds = JSON.parse(localStorage.getItem('difficultSentences') || '[]');
        let currentQueue = [];
        let currentIndex = 0;
        let isFlipped = false;

        // Initialize UI
        updateBadge();

        function updateBadge() {
            document.getElementById('difficultCountBadge').textContent = `어려운 문장: ${difficultSentenceIds.length}`;
        }

        function showMainPage() {
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('studyPage').classList.add('hidden');
            updateBadge();
        }

        // Open Setup Modal
        function openSetupModal() {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('setupPage').classList.remove('hidden');

            const chapters = [...new Set(dataset.map(item => item.chapter))].sort((a,b) => a - b);
            const chapterListEl = document.getElementById('chapterList');
            chapterListEl.innerHTML = '';

            chapters.forEach(ch => {
                const label = document.createElement('label');
                label.className = 'flex items-center space-x-3 p-2 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer';
                label.innerHTML = `
                    <input type="checkbox" value="${ch}" class="chapter-checkbox rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4" checked>
                    <span class="text-sm font-medium text-slate-700">Chapter ${ch}</span>
                `;
                chapterListEl.appendChild(label);
            });
        }

        // Utility: Fisher-Yates Shuffle
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Mode 1: Start All Practice
        function startAllPractice() {
            const checkedBoxes = document.querySelectorAll('.chapter-checkbox:checked');
            const selectedChapters = Array.from(checkedBoxes).map(cb => parseInt(cb.value));

            if (selectedChapters.length === 0) {
                alert('최소 하나 이상의 챕터를 선택해 주세요.');
                return;
            }

            let filtered = dataset.filter(item => selectedChapters.includes(item.chapter));
            
            // Randomize sentence order
            filtered = shuffle([...filtered]);

            // Sentence Count
            const countVal = document.getElementById('sentenceCountSelect').value;
            if (countVal !== 'all') {
                const count = parseInt(countVal);
                filtered = filtered.slice(0, count);
            }

            if (filtered.length === 0) {
                alert('해당하는 문장이 없습니다.');
                return;
            }

            currentQueue = filtered;
            currentIndex = 0;
            launchStudySession();
        }

        // Mode 2: Start Difficult Practice
        function startDifficultPractice() {
            if (difficultSentenceIds.length === 0) {
                alert('어려운 문장으로 등록된 항목이 없습니다.');
                return;
            }

            let filtered = dataset.filter(item => difficultSentenceIds.includes(item.id));
            
            // Randomize sentence order
            currentQueue = shuffle([...filtered]);
            currentIndex = 0;

            launchStudySession();
        }

        // Launch Flashcard Screen
        function launchStudySession() {
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('studyPage').classList.remove('hidden');

            renderCurrentCard();
        }

        // Render Current Card
        function renderCurrentCard() {
            const card = currentQueue[currentIndex];
            if (!card) return;

            // Reset Flip State
            isFlipped = false;
            document.getElementById('cardInner').classList.remove('rotate-y-180');

            // Set Content (Korean front, English back)
            document.getElementById('cardFrontText').textContent = card.ko;
            document.getElementById('cardBackText').textContent = card.en;

            // Set Pattern text (separate indicator below card)
            document.getElementById('patternText').textContent = card.pattern || '-';

            // Update Progress
            document.getElementById('progressText').textContent = `${currentIndex + 1} / ${currentQueue.length}`;

            // Update Star Icon
            updateStarUI(card.id);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const cardInner = document.getElementById('cardInner');
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentCard();
            }
        }

        function nextCard() {
            if (currentIndex < currentQueue.length - 1) {
                currentIndex++;
                renderCurrentCard();
            } else {
                alert('모든 학습 문장을 완료했습니다!');
                showMainPage();
            }
        }

        // Toggle Difficult Sentence Check
        function toggleDifficult() {
            const currentItem = currentQueue[currentIndex];
            if (!currentItem) return;

            const id = currentItem.id;
            const index = difficultSentenceIds.indexOf(id);

            if (index > -1) {
                difficultSentenceIds.splice(index, 1);
            } else {
                difficultSentenceIds.push(id);
            }

            localStorage.setItem('difficultSentences', JSON.stringify(difficultSentenceIds));
            updateStarUI(id);
            updateBadge();
        }

        function updateStarUI(id) {
            const starBtn = document.getElementById('starBtn');
            const starIcon = starBtn.querySelector('i');
            
            if (difficultSentenceIds.includes(id)) {
                starBtn.className = 'text-xl text-amber-400 transition';
                if (starIcon) starIcon.className = 'fa-solid fa-star text-amber-400';
            } else {
                starBtn.className = 'text-xl text-slate-300 hover:text-amber-400 transition';
                if (starIcon) starIcon.className = 'fa-solid fa-star text-slate-300';
            }
        }
    </script>
